<dialog class="dialog" id="brief-dialog" aria-labelledby="brief-title"><div class="dialog-head"><button class="dialog-close" aria-label="Close website brief">×</button></div><div class="dialog-body"><h2 class="dialog-title" id="brief-title">TELL US YOUR<br>SUPERPOWER.</h2><p>{{FORM_INTRO}}</p><form id="brief-form"><div class="brief-fields"><label>Your name<input name="name" maxlength="120" autocomplete="name" {{CONTACT_REQUIRED}}></label><label>Email address<input name="email" type="email" maxlength="254" autocomplete="email" {{CONTACT_REQUIRED}}></label><label>Business name<input name="business" required maxlength="100" placeholder="Your business"></label><label>What kind of website?<select name="type"><option>New business website</option><option>Refresh an existing website</option><option>Landing page</option><option>Website with bookings or a shop</option><option>Something else</option></select></label><label class="full">Existing website, if you have one<input name="website" type="text" maxlength="200" placeholder="example.co.nz"></label><label class="full">What should your website help you do?<textarea name="goal" required maxlength="1500" placeholder="Tell us about your business, your audience and your next big thing."></textarea></label></div><label class="form-honeypot" aria-hidden="true">Leave this empty<input name="company_url" type="text" tabindex="-1" autocomplete="off"></label><div class="brief-actions"><button class="btn" type="submit">{{FORM_ACTION}} <svg class="arrow" aria-hidden="true"><use href="#icon-arrow"/></svg></button><span class="brief-status" id="brief-status" role="status"></span></div></form><pre class="brief-result" id="brief-result" hidden></pre><button class="btn outline" id="copy-brief" style="margin-top:15px" hidden>Copy brief <svg class="arrow" aria-hidden="true"><use href="#icon-arrow"/></svg></button></div></dialog>
