# SWwebsite repository import automation v1.0.0
# Copies the pinned SWdemo1 source snapshot, preserving binary assets and paths.
# The import workflow deletes itself after a successful copy.
name: Import Super Websites v1.0.0

on:
  push:
    paths:
      - '.github/workflows/import-swwebsite-v1.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new SWwebsite repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout source snapshot
        uses: actions/checkout@v4
        with:
          repository: SuperWebsitesNZ/SWdemo1
          ref: 79fd71d2b39a733b141f4f38a86bfad91333ab5f
          path: _sw_source
          persist-credentials: false
      - name: Copy source files to SWwebsite
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='_sw_source/' _sw_source/ ./
          rm -rf _sw_source
          git config user.name "Super Websites Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "SWwebsite v1.5.2 - import SWdemo1 website snapshot"
            git push origin HEAD:main
          fi
