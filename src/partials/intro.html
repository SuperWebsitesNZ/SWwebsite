<dialog id="site-intro" aria-label="Super Websites opening animation">
  <div class="intro-half intro-left" aria-hidden="true"><div class="intro-chain"></div></div>
  <div class="intro-half intro-right" aria-hidden="true"><div class="intro-chain"></div></div>
  <div class="intro-mark" aria-hidden="true"><img src="{{ROOT}}assets/logo-640-v1.5.0.webp" srcset="{{ROOT}}assets/logo-320-v1.5.0.webp 320w, {{ROOT}}assets/logo-640-v1.5.0.webp 640w, {{ROOT}}assets/logo-v1.2.1.webp 1000w" sizes="(max-width: 600px) 180px, 400px" decoding="async" width="1000" height="416" alt=""><span>No subscriptions.</span></div>
  <svg class="intro-burst" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 0 57 30 80 8 68 37 100 30 73 50 100 70 68 63 80 92 57 70 50 100 43 70 20 92 32 63 0 70 27 50 0 30 32 37 20 8 43 30Z" fill="#ffd23a" stroke="#24123a" stroke-width="3" stroke-linejoin="round"/><path d="M50 28 57 43 73 50 57 57 50 73 43 57 28 50 43 43Z" fill="#fff8df"/></svg>
  <svg class="intro-fragment intro-fragment-left" viewBox="0 0 90 90" aria-hidden="true"><path d="M63 22H39a23 23 0 0 0 0 46h24" fill="none" stroke="#24123a" stroke-width="19" stroke-linecap="round"/><path d="M63 22H39a23 23 0 0 0 0 46h24" fill="none" stroke="#ffd23a" stroke-width="11" stroke-linecap="round"/><path d="M57 19H39a26 26 0 0 0-20 9" fill="none" stroke="#fff8df" stroke-width="2" stroke-linecap="round"/></svg>
  <svg class="intro-fragment intro-fragment-right" viewBox="0 0 90 90" aria-hidden="true"><path d="M27 22h24a23 23 0 0 1 0 46H27" fill="none" stroke="#24123a" stroke-width="19" stroke-linecap="round"/><path d="M27 22h24a23 23 0 0 1 0 46H27" fill="none" stroke="#ffd23a" stroke-width="11" stroke-linecap="round"/><path d="M33 19h18a26 26 0 0 1 20 9" fill="none" stroke="#fff8df" stroke-width="2" stroke-linecap="round"/></svg>
  <button class="intro-skip" type="button" autofocus>Skip intro <span aria-hidden="true">↗</span></button>
</dialog>
<script>
// Super Websites v1.5.1 | 2026-10-14 | Early, fail-open chain-break intro.
// Adapted from DC's SWdemo2 concept. The closed native dialog never blocks a no-JS visit.
(() => {
  'use strict';
  const intro = document.querySelector('#site-intro');
  if (!intro) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const seenKey = 'sw-demo1-chain-intro-seen';
  let timer = 0;
  let running = false;

  function unlock() {
    const wasRunning = running;
    clearTimeout(timer);
    timer = 0;
    running = false;
    intro.classList.remove('intro-active');
    document.body.classList.remove('intro-lock');
    if (wasRunning) document.dispatchEvent(new Event('sw:intro-finished'));
  }
  function finish() {
    unlock();
    if (intro.open) intro.close();
  }
  function play(force = false) {
    if (running || intro.open || reduce.matches || document.hidden || document.documentElement.classList.contains('motion-paused')) return false;
    if (!force && window.location.hash && window.location.hash !== '#main') return false;
    if (!force) {
      try { if (sessionStorage.getItem(seenKey)) return false; } catch { /* Storage is optional. */ }
    }
    if (typeof intro.showModal !== 'function') return false;
    try {
      intro.showModal();
      running = true;
      document.body.classList.add('intro-lock');
      // Flush the reset frame so the footer replay gets a fresh CSS timeline.
      void intro.offsetWidth;
      intro.classList.add('intro-active');
      timer = setTimeout(finish, 2300);
      document.dispatchEvent(new Event('sw:intro-started'));
      try { sessionStorage.setItem(seenKey, '1'); } catch { /* Private/storage-restricted browsing still works. */ }
      return true;
    } catch {
      finish();
      return false;
    }
  }
  intro.addEventListener('click', finish);
  intro.addEventListener('cancel', event => { event.preventDefault(); finish(); });
  intro.addEventListener('close', () => { if (!intro.open) unlock(); });
  intro.addEventListener('animationend', event => {
    if (running && event.animationName === 'intro-reveal-right') finish();
  });
  reduce.addEventListener?.('change', () => { if (reduce.matches) finish(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) finish(); });
  window.addEventListener('pagehide', finish);
  window.addEventListener('pageshow', event => { if (event.persisted) finish(); });

  function bindReplay() {
    const replay = document.querySelector('#intro-replay');
    if (!replay) return;
    const update = () => {
      replay.hidden = reduce.matches || typeof intro.showModal !== 'function';
      replay.disabled = document.documentElement.classList.contains('motion-paused');
    };
    update();
    reduce.addEventListener?.('change', update);
    document.querySelector('#motion-toggle')?.addEventListener('click', update);
    replay.addEventListener('click', () => play(true));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindReplay, { once: true });
  else bindReplay();
  play();
})();

</script>
